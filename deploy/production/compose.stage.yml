services:
  postgres:
    networks:
      - stage-data

  stage-db-provision:
    image: ${BACKEND_IMAGE:?Set an immutable backend image digest}
    user: "10001:10001"
    profiles: ["stage-setup"]
    restart: "no"
    environment:
      JOB_LOCK_TIMEOUT_SECONDS: "5"
      DATABASE_HOST: postgres
      DATABASE_BOOTSTRAP_USER: ${DATABASE_BOOTSTRAP_USER:?Set DATABASE_BOOTSTRAP_USER}
      DATABASE_BOOTSTRAP_PASSWORD_FILE: /run/secrets/database_bootstrap_password
      TARGET_DATABASE_NAME: ${STAGE_DATABASE_NAME:?Set STAGE_DATABASE_NAME}
      TARGET_DATABASE_USER: ${STAGE_DATABASE_USER:?Set STAGE_DATABASE_USER}
      TARGET_DATABASE_PASSWORD_FILE: /run/secrets/stage_database_password
      PROTECTED_DATABASE_NAME: ${PROD_DATABASE_NAME:?Set PROD_DATABASE_NAME}
      PROTECTED_DATABASE_USER: ${PROD_DATABASE_USER:?Set PROD_DATABASE_USER}
    entrypoint: ["/bin/sh", "/opt/tsing-radar/job-lock.sh"]
    command: ["python", "/opt/tsing-radar/database_provision.py"]
    group_add: ["${JOB_LOCK_GID:?Set the host job-lock group id}"]
    secrets:
      - source: database_bootstrap_password
        target: database_bootstrap_password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_database_password
        target: stage_database_password
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - ./scripts/database_provision.py:/opt/tsing-radar/database_provision.py:ro
      - ./scripts/job-lock.sh:/opt/tsing-radar/job-lock.sh:ro
      - ${JOB_LOCK_FILE:?Set the pre-created host job-lock file}:/run/tsing-radar/job.lock
    networks:
      - stage-data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 128m
    cpus: 0.25

  stage-redis:
    image: ${REDIS_IMAGE:?Set an immutable Redis image digest}
    profiles: ["stage"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/tsing-radar/redis-entrypoint.sh"]
    secrets:
      - source: stage_redis_password
        target: redis_password
    volumes:
      - stage_redis_data:/data
      - ./scripts/redis-entrypoint.sh:/opt/tsing-radar/redis-entrypoint.sh:ro
      - ./scripts/redis-healthcheck.sh:/opt/tsing-radar/redis-healthcheck.sh:ro
    networks:
      - stage-data
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/tsing-radar/redis-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.2
    cpu_shares: 256

  stage-backend:
    image: ${BACKEND_IMAGE:?Set an immutable backend image digest}
    user: "10001:10001"
    profiles: ["stage"]
    restart: unless-stopped
    init: true
    environment:
      DEBUG: "false"
      PRODUCTION_DEPLOYMENT: "true"
      AUTO_CREATE_SCHEMA: "false"
      JOB_LOCK_TIMEOUT_SECONDS: "5"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${STAGE_DATABASE_NAME:?Set STAGE_DATABASE_NAME}
      DATABASE_USER: ${STAGE_DATABASE_USER:?Set STAGE_DATABASE_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      REDIS_HOST: stage-redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      SESSION_HMAC_SECRET_FILE: /run/secrets/session_hmac_secret
      ARTIFACT_SIGNING_SECRET_FILE: /run/secrets/artifact_signing_secret
      WEB_COOKIE_SECURE: "true"
      OBJECT_STORE_BACKEND: s3
      S3_PROVIDER: tencent_cos
      S3_BUCKET: ${STAGE_COS_BUCKET:?Set a stage-only COS bucket}
      S3_ENDPOINT_URL: https://cos.ap-shanghai.myqcloud.com
      S3_REGION: ap-shanghai
      S3_ACCESS_KEY_ID_FILE: /run/secrets/cos_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/cos_secret_access_key
      S3_ADDRESSING_STYLE: virtual
      S3_SERVER_SIDE_ENCRYPTION: AES256
      FILE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
      QXD_TRIAL_SINGLE_USER_MODE: "false"
      QXD_REMOTE_MEDIA_FETCH_ENABLED: "false"
      QXD_ATTACHMENTS_ENABLED: "false"
      PUBLIC_BASE_URL: ""
      CORS_ORIGINS: ${STAGE_CORS_ORIGINS:?Set exact stage CORS origins}
      # No MILVUS_HOST: deterministic lexical fallback is mandatory until an
      # isolated stage Milvus or verified server-side RBAC is provided.
    secrets:
      - source: stage_database_password
        target: database_password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_redis_password
        target: redis_password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_admin_token
        target: admin_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_session_hmac_secret
        target: session_hmac_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_artifact_signing_secret
        target: artifact_signing_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_cos_access_key_id
        target: cos_access_key_id
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: stage_cos_secret_access_key
        target: cos_secret_access_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    entrypoint: ["/bin/sh", "/opt/tsing-radar/job-lock.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    group_add: ["${JOB_LOCK_GID:?Set the host job-lock group id}"]
    volumes:
      - ./scripts/job-lock.sh:/opt/tsing-radar/job-lock.sh:ro
      - ${JOB_LOCK_FILE:?Set the pre-created host job-lock file}:/run/tsing-radar/job.lock
    networks:
      - stage-app
      - stage-data
      - scanner-shared
      - stage-egress
    depends_on:
      postgres:
        condition: service_healthy
      stage-redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 192
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.6
    cpu_shares: 256

  stage-frontend:
    image: ${FRONTEND_IMAGE:?Set an immutable frontend image digest}
    profiles: ["stage"]
    restart: unless-stopped
    networks:
      - stage-app
    depends_on:
      stage-backend:
        condition: service_healthy
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.1
    cpu_shares: 128

networks:
  stage-app:
    internal: true
  stage-data:
    internal: true
  stage-egress: {}
  scanner-shared:
    internal: true

volumes:
  stage_redis_data: {}

secrets:
  stage_database_password:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/database_password
  stage_redis_password:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/redis_password
  stage_admin_token:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/admin_token
  stage_session_hmac_secret:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/session_hmac_secret
  stage_artifact_signing_secret:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/artifact_signing_secret
  stage_cos_access_key_id:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/cos_access_key_id
  stage_cos_secret_access_key:
    file: ${STAGE_SECRET_ROOT:?Set STAGE_SECRET_ROOT}/cos_secret_access_key
