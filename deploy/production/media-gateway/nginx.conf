pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    default_type application/octet-stream;
    log_format attachment_safe 'request_id=$request_id method=$request_method route_id=qxd_attachment status=$status bytes=$body_bytes_sent';
    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080 default_server;
        server_name _;
        client_max_body_size 1k;
        keepalive_timeout 10s;
        location ~ "^/v1/attachments/[A-Za-z0-9._~-]{20,2048}$" {
            access_log /dev/stdout attachment_safe;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            if ($args != "") { return 404; }
            proxy_pass http://backend:8000;
            proxy_set_header Host backend;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_hide_header Server;
        }
        location / { return 404; }
    }
}
