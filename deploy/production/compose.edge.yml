services:
  edge:
    image: ${CADDY_IMAGE:?Set an immutable Caddy image digest}
    restart: unless-stopped
    environment:
      WEB_HOST: ${WEB_HOST:?Set the approved Web host}
    ports:
      - target: 80
        published: "80"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./edge/routes/web-api.caddy:/etc/caddy/routes/10-web-api.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - prod-app
      - public-edge
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.2
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  prod-app:
    internal: true
  public-edge: {}

volumes:
  caddy_data: {}
  caddy_config: {}
