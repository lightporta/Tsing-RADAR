services:
  backend:
    environment:
      ARTIFACTS_ENABLED: "true"
      OBJECT_STORE_BACKEND: s3
      S3_PROVIDER: tencent_cos
      S3_BUCKET: ${PROD_COS_BUCKET:?Set the separately approved private production COS bucket}
      S3_ENDPOINT_URL: https://cos.ap-hongkong.myqcloud.com
      S3_REGION: ap-hongkong
      S3_ACCESS_KEY_ID_FILE: /run/secrets/cos_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/cos_secret_access_key
      S3_ADDRESSING_STYLE: virtual
      S3_SERVER_SIDE_ENCRYPTION: AES256
      QXD_ATTACHMENTS_ENABLED: "true"
      PUBLIC_BASE_URL: https://${MEDIA_HOST:?Set the separately approved media host}
    volumes:
      - type: bind
        source: ${SECRET_ROOT:?Set SECRET_ROOT}/cos_access_key_id
        target: /run/secrets/cos_access_key_id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECRET_ROOT:?Set SECRET_ROOT}/cos_secret_access_key
        target: /run/secrets/cos_secret_access_key
        read_only: true
        bind:
          create_host_path: false

  media-gateway:
    image: ${NGINX_UNPRIVILEGED_IMAGE:?Set an immutable unprivileged Nginx image digest}
    restart: unless-stopped
    volumes:
      - ./media-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - prod-app
    depends_on:
      backend:
        condition: service_healthy
      qxd-gateway:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1770,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.15
    cpu_shares: 256

  edge:
    environment:
      MEDIA_HOST: ${MEDIA_HOST:?Set the separately approved media host}
    volumes:
      - ./edge/routes/media.caddy:/etc/caddy/routes/30-media.caddy:ro
