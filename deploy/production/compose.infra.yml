name: ${COMPOSE_PROJECT_NAME:-tsing-radar-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime: &runtime
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:?Set an immutable PostgreSQL image digest}
    environment:
      POSTGRES_USER: ${DATABASE_BOOTSTRAP_USER:?Set DATABASE_BOOTSTRAP_USER}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_bootstrap_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ${BOOTSTRAP_SECRET_ROOT:?Set BOOTSTRAP_SECRET_ROOT}/database_bootstrap_password
        target: /run/secrets/database_bootstrap_password
        read_only: true
        bind:
          create_host_path: false
    networks:
      - prod-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.0
    cpu_shares: 1024

  redis:
    <<: *runtime
    image: ${REDIS_IMAGE:?Set an immutable Redis image digest}
    entrypoint: ["/bin/sh", "/opt/tsing-radar/redis-entrypoint.sh"]
    volumes:
      - redis_data:/data
      - ./scripts/redis-entrypoint.sh:/opt/tsing-radar/redis-entrypoint.sh:ro
      - ./scripts/redis-healthcheck.sh:/opt/tsing-radar/redis-healthcheck.sh:ro
      - type: bind
        source: ${SECRET_ROOT:?Set SECRET_ROOT}/redis_password
        target: /run/secrets/redis_password
        read_only: true
        bind:
          create_host_path: false
    networks:
      - prod-data
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/tsing-radar/redis-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.25
    cpu_shares: 512

  clamav:
    <<: *runtime
    image: ${CLAMAV_IMAGE:?Set an immutable ClamAV image digest}
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "900"
      FRESHCLAM_CHECKS: "24"
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks:
      - scanner-shared
      - scanner-egress
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1:1 --wait /etc/hostname >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s
    stop_grace_period: 60s
    mem_limit: 1408m
    mem_reservation: 768m
    cpus: 1.25
    cpu_shares: 512

networks:
  prod-data:
    internal: true
  scanner-egress: {}
  scanner-shared:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  clamav_signatures: {}
