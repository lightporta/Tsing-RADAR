pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    log_format safe 'request_id=$request_id method=$request_method uri=$uri status=$status duration=$request_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;
    limit_req_zone $server_name zone=global:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

    server {
        listen 8080 default_server;
        server_name _;
        client_max_body_size 128k;
        client_body_timeout 10s;
        keepalive_timeout 15s;
        send_timeout 120s;
        limit_req zone=per_ip burst=5 nodelay;
        limit_req zone=global burst=10 nodelay;
        limit_req_status 429;
        limit_conn conn_ip 12;
        limit_conn_status 429;

        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 115s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host backend;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        location = /v1/models {
            if ($request_method != GET) { return 405; }
            if ($args != "") { return 404; }
            proxy_pass http://backend:8000/v1/models;
        }
        location = /v1/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 404; }
            proxy_pass http://backend:8000/v1/chat/completions;
        }
        location / { return 404; }
    }
}
