# Tsing-RADAR 完整基础设施编排（可选）
# 生产期部署用：PostgreSQL + Redis + Milvus + 后端 + 前端
#
# 开发期无需启动此文件，前后端可独立运行（SQLite + 内存 store）。
# 启动：docker-compose up -d
# 停止：docker-compose down

version: "3.8"

services:
  # ===== 关系数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: tsing-radar-postgres
    environment:
      POSTGRES_USER: tsingradar
      POSTGRES_PASSWORD: tsingradar_dev_pwd
      POSTGRES_DB: tsingradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsingradar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: tsing-radar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 向量数据库 =====
  # Milvus 依赖 etcd 与 minio，此处使用单机 standalone 镜像
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tsing-radar-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tsing-radar-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: tsing-radar-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  # ===== 后端 =====
  backend:
    build: ./backend
    container_name: tsing-radar-backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tsingradar:tsingradar_dev_pwd@postgres:5432/tsingradar
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started

  # ===== 前端 =====
  frontend:
    build: ./frontend
    container_name: tsing-radar-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
