server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA route fallback. API traffic is intentionally handled only by the
    # edge allowlist and must never be proxied by this static container.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
